# FindIt — Multi-Container Docker Compose Specification
services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: findit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changethis_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-findit_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-findit_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: findit-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changethis_in_production}@db:5432/${POSTGRES_DB:-findit_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-findit-super-secret-key-change-in-production}
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173","http://localhost:80","http://127.0.0.1:80","http://localhost"]
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data

  # 3. React Vite Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: findit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
    driver: local
  backend_data:
    driver: local
