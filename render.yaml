services:
  # FindIt FastAPI Backend Web Service
  - type: web
    name: findit-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: "FindIt API"
      - key: VERSION
        value: "0.1.0"
      - key: API_V1_STR
        value: "/api/v1"
      - key: ENABLE_DOCS
        value: "true"
      # Secure environment variables to configure in Render Dashboard:
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
